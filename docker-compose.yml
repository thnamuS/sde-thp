name: nexora

x-common-env: &common-env
  DATABASE_URL: postgres://nexora:nexora_dev@postgres:5432/nexora?sslmode=disable
  DBOS_SYSTEM_DATABASE_URL: postgres://nexora:nexora_dev@postgres:5432/nexora?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  INTERNAL_SECRET: ${INTERNAL_SECRET:-development-internal-secret}
  JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me}
  ACME_API_KEY: ${ACME_API_KEY:-acme_demo_key_change_me_123456}
  LOREM_API_KEY: ${LOREM_API_KEY:-lorem_demo_key_change_me_123456}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

x-go-service: &go-service
  image: nexora-backend:local
  build:
    context: .
    dockerfile: build/go.Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [nexora]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks: [nexora]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [redis_data:/data]
    networks: [nexora]

  access:
    <<: *go-service
    command: ["/services/access"]
    environment:
      <<: *common-env
      PORT: "8081"

  operations:
    <<: *go-service
    command: ["/services/operations"]
    environment:
      <<: *common-env
      PORT: "8082"
      USAGE_URL: http://usage:8083

  usage:
    <<: *go-service
    command: ["/services/usage"]
    environment:
      <<: *common-env
      PORT: "8083"

  gateway:
    <<: *go-service
    command: ["/services/gateway"]
    environment:
      <<: *common-env
      PORT: "8080"
      ACCESS_URL: http://access:8081
      OPERATIONS_URL: http://operations:8082
      USAGE_URL: http://usage:8083
    depends_on:
      access: {condition: service_started}
      operations: {condition: service_started}
      usage: {condition: service_started}
    ports: ["127.0.0.1:8080:8080"]

  worker:
    <<: *go-service
    command: ["/services/worker"]
    environment:
      <<: *common-env
      OPERATIONS_URL: http://operations:8082
      USAGE_URL: http://usage:8083
    deploy:
      replicas: 2
    profiles: ["cloud-worker"]

  enterprise-worker:
    <<: *go-service
    command: ["/services/enterprise-worker"]
    environment:
      <<: *common-env
      NEXORA_API_URL: http://gateway:8080
      ENTERPRISE_WORKER_API_KEY: ${ACME_API_KEY:-acme_demo_key_change_me_123456}
      ENTERPRISE_TARGET_URL: http://acme:8090/work
    depends_on:
      gateway: {condition: service_started}
      acme: {condition: service_started}
    networks: [nexora]

  lorem-enterprise-worker:
    <<: *go-service
    command: ["/services/enterprise-worker"]
    environment:
      <<: *common-env
      NEXORA_API_URL: http://gateway:8080
      ENTERPRISE_WORKER_API_KEY: ${LOREM_API_KEY:-lorem_demo_key_change_me_123456}
      ENTERPRISE_TARGET_URL: http://lorem:8091/work
    depends_on:
      gateway: {condition: service_started}
      lorem: {condition: service_started}
    networks: [nexora]

  acme:
    <<: *go-service
    command: ["/services/acme"]
    environment:
      <<: *common-env
      PORT: "8090"
      NEXORA_API_URL: http://gateway:8080
      OPERATION_TARGET_URL: http://acme:8090/work
    ports: ["127.0.0.1:8090:8090"]

  lorem:
    <<: *go-service
    command: ["/services/acme"]
    environment:
      <<: *common-env
      PORT: "8091"
      NEXORA_API_URL: http://gateway:8080
      ACME_API_KEY: ${LOREM_API_KEY:-lorem_demo_key_change_me_123456}
      OPERATION_TARGET_URL: http://lorem:8091/work
    ports: ["127.0.0.1:8091:8091"]

  customer-web:
    build:
      context: ./web/customer
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8080}
    environment: {NEXT_PUBLIC_API_URL: http://127.0.0.1:8080}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [gateway]
    networks: [nexora]

  admin-web:
    build:
      context: ./web/admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8080}
    environment: {NEXT_PUBLIC_API_URL: http://127.0.0.1:8080}
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [gateway]
    networks: [nexora]

volumes:
  postgres_data:
  redis_data:

networks:
  nexora:
